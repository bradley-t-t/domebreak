name: Release — deploy site

# Redeploys the marketing site to Vercel production when a release lands on
# main. Also dispatchable: the /ship skill re-runs it after publishing
# installers and deploying the game server, so the site (and the version.json
# the game's update check polls) goes live only once the release is real.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_8KwOtFUhRyHmZM8dPzqh0fq9
      VERCEL_PROJECT_ID: prj_gVVToIRWCTEr9T6WHRAeCj1mhrXa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The site build imports the game engine from ../src, whose bare imports
      # resolve from the repo-root node_modules — install them.
      - run: npm ci
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
